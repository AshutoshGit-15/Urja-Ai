<!DOCTYPE html>
<html>
<head>
    <title>Electricity Demand Predictor</title>
    {%load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

<div class="container">

    <h1>Electricity Demand Predictor</h1>

    <form action="/predict" method="POST">

        <input type="number" name="temperature" placeholder="Temperature" required>

        <input type="number" name="humidity" placeholder="Humidity" required>

        <input type="number" name="wind_speed" placeholder="Wind Speed" required>

        <input type="number" name="hour" placeholder="Hour (0-23)" required>

        <input type="number" name="day" placeholder="Day" required>

        <input type="number" name="month" placeholder="Month" required>

        <button type="submit">Predict</button>

    </form>

    {% if prediction %}
        <div class="result">
            <h2>Predicted Demand</h2>
            <p>{{ prediction }} MW</p>
        </div>
    {% endif %}

</div>

</body>
</html>
